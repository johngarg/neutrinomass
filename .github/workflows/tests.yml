name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hash-seed: [0, 1]
    env:
      PYTHONHASHSEED: ${{ matrix.hash-seed }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pytest -q
